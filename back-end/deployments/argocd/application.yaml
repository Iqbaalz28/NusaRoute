apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nusaroute
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Iqbaalz28/NusaRoute.git'
    targetRevision: HEAD
    path: back-end/deployments/helm/nusaroute
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nusaroute
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
