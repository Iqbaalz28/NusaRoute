# Kubernetes Deployment Template for NusaRoute Services
# This file generates deployments for all services

---
# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nusaroute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: nusaroute/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: jwt-secret
        - name: USER_SERVICE_URL
          value: "http://user-service.nusaroute.svc.cluster.local:8001"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service.nusaroute.svc.cluster.local:8002"
        - name: PRICING_SERVICE_URL
          value: "http://pricing-service.nusaroute.svc.cluster.local:8003"
        - name: ORDER_SERVICE_URL
          value: "http://order-service.nusaroute.svc.cluster.local:8004"
        - name: COURIER_SERVICE_URL
          value: "http://courier-service.nusaroute.svc.cluster.local:8005"
        - name: DISPATCH_SERVICE_URL
          value: "http://dispatch-service.nusaroute.svc.cluster.local:8006"
        - name: HUB_SERVICE_URL
          value: "http://hub-service.nusaroute.svc.cluster.local:8007"
        - name: TRACKING_SERVICE_URL
          value: "http://tracking-service.nusaroute.svc.cluster.local:8008"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service.nusaroute.svc.cluster.local:8009"
        - name: RESOLUTION_SERVICE_URL
          value: "http://resolution-service.nusaroute.svc.cluster.local:8010"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nusaroute
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8080

---
# User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: nusaroute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: nusaroute/user-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: DB_HOST
          value: "postgres.nusaroute.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: db-password
        - name: DB_NAME
          value: "nusaroute_user"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: jwt-secret
        - name: REDIS_ADDR
          value: "redis.nusaroute.svc.cluster.local:6379"
        - name: KAFKA_BROKERS
          value: "kafka.nusaroute.svc.cluster.local:9092"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: nusaroute
spec:
  selector:
    app: user-service
  ports:
  - port: 8001
    targetPort: 8001

---
# Order Service (with higher resources for SLA monitor background tasks)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: nusaroute
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: nusaroute/order-service:latest
        ports:
        - containerPort: 8004
        env:
        - name: PORT
          value: "8004"
        - name: DB_HOST
          value: "postgres.nusaroute.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: db-password
        - name: DB_NAME
          value: "nusaroute_order"
        - name: KAFKA_BROKERS
          value: "kafka.nusaroute.svc.cluster.local:9092"
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: nusaroute
spec:
  selector:
    app: order-service
  ports:
  - port: 8004
    targetPort: 8004

---
# Tracking Service (highest replicas for handling extreme load during Harbolnas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: nusaroute
spec:
  replicas: 5
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
      - name: tracking-service
        image: nusaroute/tracking-service:latest
        ports:
        - containerPort: 8008
        env:
        - name: PORT
          value: "8008"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: mongo-uri
        - name: MONGO_DB
          value: "nusaroute_tracking"
        - name: REDIS_ADDR
          value: "redis.nusaroute.svc.cluster.local:6379"
        - name: KAFKA_BROKERS
          value: "kafka.nusaroute.svc.cluster.local:9092"
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: nusaroute
spec:
  selector:
    app: tracking-service
  ports:
  - port: 8008
    targetPort: 8008

---
# Dispatch Service (CPU-intensive for VRP algorithm)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-service
  namespace: nusaroute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dispatch-service
  template:
    metadata:
      labels:
        app: dispatch-service
    spec:
      containers:
      - name: dispatch-service
        image: nusaroute/dispatch-service:latest
        ports:
        - containerPort: 8006
        env:
        - name: PORT
          value: "8006"
        - name: DB_HOST
          value: "postgres.nusaroute.svc.cluster.local"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nusaroute-secrets
              key: db-password
        - name: DB_NAME
          value: "nusaroute_dispatch"
        - name: KAFKA_BROKERS
          value: "kafka.nusaroute.svc.cluster.local:9092"
        - name: COURIER_SERVICE_URL
          value: "http://courier-service.nusaroute.svc.cluster.local:8005"
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-service
  namespace: nusaroute
spec:
  selector:
    app: dispatch-service
  ports:
  - port: 8006
    targetPort: 8006

---
# HorizontalPodAutoscaler for Tracking Service (handles peak Harbolnas traffic)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracking-service-hpa
  namespace: nusaroute
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracking-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HPA for Dispatch Service (CPU-intensive VRP algorithm)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dispatch-service-hpa
  namespace: nusaroute
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dispatch-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

---
# Kubernetes Secret (template — actual values should be managed externally or via Vault/SealedSecrets)
apiVersion: v1
kind: Secret
metadata:
  name: nusaroute-secrets
  namespace: nusaroute
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET"
  db-user: "nusaroute"
  db-password: "REPLACE_WITH_DB_PASSWORD"
  redis-password: "REPLACE_WITH_REDIS_PASSWORD"
  mongo-uri: "mongodb://nusaroute:REPLACE_WITH_MONGO_PASSWORD@mongodb:27017"
