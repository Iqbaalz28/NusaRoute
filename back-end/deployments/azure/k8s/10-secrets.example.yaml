# Copy to 10-secrets.yaml, fill in real values, then:  kubectl apply -f 10-secrets.yaml
# (10-secrets.yaml is gitignored — never commit real secrets.)
# This Secret is referenced by every Deployment AND by the backing services.
apiVersion: v1
kind: Secret
metadata:
  name: nusaroute-secrets
  namespace: nusaroute
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_long_random_string"
  db-user: "nusaroute"
  db-password: "CHANGE_ME_db_password"
  redis-password: "CHANGE_ME_redis_password"
  mongo-user: "nusaroute"
  mongo-password: "CHANGE_ME_mongo_password"
  # mongo-uri must embed mongo-user/mongo-password above.
  mongo-uri: "mongodb://nusaroute:CHANGE_ME_mongo_password@mongodb.nusaroute.svc.cluster.local:27017"
  minio-user: "nusaroute"
  minio-password: "CHANGE_ME_minio_password"
