apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources are explicitly namespaced to "nusaroute".
# Image registry: every app image uses the prefix REGISTRY_PLACEHOLDER, replaced
# at apply time:
#   kubectl kustomize k8s | sed "s|REGISTRY_PLACEHOLDER|$ACR_LOGIN_SERVER|g" | kubectl apply -f -
# The Secret (nusaroute-secrets) is applied separately from 10-secrets.yaml and
# is intentionally NOT listed here so real secrets never live in git.
resources:
  - 00-namespace.yaml
  - 15-postgres-initdb.yaml
  - 20-backing.yaml
  - 30-app.yaml
  - 40-istio.yaml
  - 50-hpa.yaml
