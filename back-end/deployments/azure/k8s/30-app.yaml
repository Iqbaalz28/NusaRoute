# ============================================================================
# Application services. Images come from ${REGISTRY}/<name>:${TAG} — kustomize
# rewrites the "REGISTRY_PLACEHOLDER" prefix via the `images` transformer in
# kustomization.yaml (set your ACR login server there or with `kubectl edit`).
# ============================================================================

# ---------------------------------------------------------------------------
# api-gateway (edge of the mesh; Istio routes /api here)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nusaroute
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: REGISTRY_PLACEHOLDER/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: nusaroute-secrets, key: jwt-secret } }
            - { name: USER_SERVICE_URL, value: "http://user-service:8001" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:8002" }
            - { name: PRICING_SERVICE_URL, value: "http://pricing-service:8003" }
            - { name: ORDER_SERVICE_URL, value: "http://order-service:8004" }
            - { name: COURIER_SERVICE_URL, value: "http://courier-service:8005" }
            - { name: DISPATCH_SERVICE_URL, value: "http://dispatch-service:8006" }
            - { name: HUB_SERVICE_URL, value: "http://hub-service:8007" }
            - { name: TRACKING_SERVICE_URL, value: "http://tracking-service:8008" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8009" }
            - { name: RESOLUTION_SERVICE_URL, value: "http://resolution-service:8010" }
            - { name: ANALYTICS_SERVICE_URL, value: "http://analytics-service:8011" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: nusaroute }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# ---------------------------------------------------------------------------
# user-service
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: nusaroute }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: REGISTRY_PLACEHOLDER/user-service:latest
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - { name: DB_HOST, value: "postgres" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "nusaroute_user" }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: nusaroute-secrets, key: db-user } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: nusaroute-secrets, key: db-password } } }
            - { name: REDIS_ADDR, value: "redis:6379" }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: nusaroute-secrets, key: redis-password } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: nusaroute-secrets, key: jwt-secret } } }
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: nusaroute }
spec:
  selector: { app: user-service }
  ports: [{ port: 8001, targetPort: 8001 }]
---
