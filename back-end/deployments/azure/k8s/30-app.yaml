# ---------------------------------------------------------------------------
# frontend (Next.js, same-origin → /api routed to api-gateway by Istio)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: nusaroute }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: REGISTRY_PLACEHOLDER/frontend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: nusaroute }
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
