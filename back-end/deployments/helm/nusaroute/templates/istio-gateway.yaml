{{- if .Values.global.istioInjection }}
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: nusaroute-gateway
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: {{ .Values.global.namespace }}
spec:
  hosts:
  - "*"
  gateways:
  - nusaroute-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: api-gateway
        port:
          number: 8080
{{- end }}
